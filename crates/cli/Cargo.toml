[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cosmic-wicara CLI binary (clap parse boundary, ExitCode mapping)"
default-run = "cosmic-wicara"

[[bin]]
name = "cosmic-wicara"
path = "src/main.rs"

[dependencies]
clap.workspace = true
wicara_core = { package = "core", path = "../core" }
wicara_app = { package = "app", path = "../app" }
libcosmic.workspace = true
jiff = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
